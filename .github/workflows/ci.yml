name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://example.invalid
      NEXT_PUBLIC_BASE_PATH: /s2health-pa

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard data tests
        run: npm run test:dashboard

      - name: Run raw-count KPI semantic tests
        run: npm run test:kpi-semantics

      - name: Run accessibility contract tests
        run: node --test src/components/accessibility-contract.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Validate export boundary
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next

          if grep -R -n -F 'pa-dashboard-api:3001' out src next.config.ts; then
            echo 'Internal container API topology leaked into public frontend'
            exit 1
          fi

          if grep -R -n -F 'script.google.com/macros' out src; then
            echo 'Legacy Google Apps Script endpoint leaked into public frontend'
            exit 1
          fi
