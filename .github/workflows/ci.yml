name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run zero-dependency unit tests
        run: node --test test/*.test.js

      - name: Validate static module syntax
        run: node --check site/js/*.js

      - name: Enforce DOM injection boundary
        run: |
          if grep -R -n -E '\\.(innerHTML|outerHTML)[[:space:]]*=' site/js; then
            echo "Unsafe HTML assignment found"
            exit 1
          fi
