# S2Health PA — API-only OCI release. This is source configuration:
# no publication occurs unless an explicit oci-<sha12> tag is pushed.
# A tag must refer to the CURRENT main HEAD. This job never deploys to Fedora.
name: OCI Release (API)

on:
  push:
    tags:
      - "oci-*"

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Publish immutable API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fail-closed main/tag authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected full lowercase commit SHA"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] || [[ "${GITHUB_REF_NAME}" != "oci-${GITHUB_SHA:0:12}" ]]; then
            echo "::error::Release tag must be oci-<first12ofcommit>"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tagged SHA is not the current origin/main"
            exit 1
          fi

      - name: Verify deployment contract
        run: node --test infra/test/deployment-contract.test.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API only
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./infra/containers/api.Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: ghcr.io/9gotstory/s2health-pa-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/9GotStory/s2health-pa
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}

      - name: Validate digest and publish release evidence
        shell: bash
        env:
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid immutable API digest"
            exit 1
          fi
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "release_tag=${GITHUB_REF_NAME}"
            echo "api_image=ghcr.io/9gotstory/s2health-pa-api@${API_DIGEST}"
            echo "fedora_cutover=NOT_PERFORMED"
          } >> "${GITHUB_STEP_SUMMARY}"
