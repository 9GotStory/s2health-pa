name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_BASE_PATH: /s2health-pa

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate public API configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("NEXT_PUBLIC_API_BASE_URL", "").strip().rstrip("/")
          if not value:
              raise SystemExit("PUBLIC_API_BASE_URL repository variable is required")

          parsed = urlparse(value)
          if (
              parsed.scheme != "https"
              or not parsed.netloc
              or parsed.username
              or parsed.password
              or parsed.path not in ("", "/")
              or parsed.params
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("PUBLIC_API_BASE_URL must be an exact HTTPS origin")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard data tests
        run: npm run test:dashboard

      - name: Run raw-count KPI semantic tests
        run: npm run test:kpi-semantics

      - name: Run accessibility contract tests
        run: node --test src/components/accessibility-contract.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Validate public export
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next
          touch out/.nojekyll

          if ! grep -R -Fq "$NEXT_PUBLIC_API_BASE_URL" out; then
            echo 'Configured public API origin was not embedded in the client export'
            exit 1
          fi

          if grep -R -n -F 'pa-dashboard-api:3001' out; then
            echo 'Internal container API topology leaked into export'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
