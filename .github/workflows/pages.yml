name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dashboard unit tests
        run: node --test test/*.test.js

      - name: Validate dashboard module syntax
        run: node --check site/js/*.js

      - name: Enforce DOM injection boundary
        run: |
          if grep -R -n -E '\\.(innerHTML|outerHTML)[[:space:]]*=' site/js; then
            echo "Unsafe HTML assignment found"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate runtime configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base_url = os.environ.get("PUBLIC_API_BASE_URL", "").strip().rstrip("/")
          config = {
              "apiBaseUrl": api_base_url,
              "readinessPath": "/api/v1/health/ready",
          }
          payload = "window.S2HEALTH_CONFIG = " + json.dumps(
              config, ensure_ascii=False, separators=(",", ":")
          ) + ";\n"
          Path("site/config.js").write_text(payload, encoding="utf-8")
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
