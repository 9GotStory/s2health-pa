<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>S2Health PA</title>
  <meta name="description" content="PA Dashboard สำหรับเครือข่ายสุขภาพอำเภอสอง">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(14,165,233,.12), transparent 32rem),
        #f8fafc;
    }
    main {
      width: min(760px, 100%);
      background: rgba(255,255,255,.94);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: clamp(28px, 5vw, 48px);
      box-shadow: 0 24px 70px rgba(15,23,42,.08);
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #0369a1;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: -.04em;
    }
    .lead {
      margin: 22px 0 0;
      max-width: 56ch;
      color: #475569;
      font-size: 1.05rem;
      line-height: 1.75;
    }
    .status {
      margin-top: 30px;
      padding: 18px 20px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      background: #f8fafc;
    }
    .status[data-state="ready"] {
      border-color: #a7f3d0;
      background: #ecfdf5;
    }
    .status[data-state="checking"] {
      border-color: #bae6fd;
      background: #f0f9ff;
    }
    .status[data-state="error"] {
      border-color: #fecaca;
      background: #fef2f2;
    }
    .status strong {
      display: block;
      margin-bottom: 5px;
      color: #0f172a;
    }
    .status span {
      color: #475569;
      line-height: 1.6;
    }
    code {
      overflow-wrap: anywhere;
      font-size: .86em;
    }
    footer {
      margin-top: 30px;
      color: #94a3b8;
      font-size: .85rem;
    }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Song District Health</p>
    <h1>S2Health PA</h1>
    <p class="lead">
      ระบบแสดงผลข้อมูล PA สำหรับเครือข่ายสุขภาพอำเภอสอง
      โดยใช้ GitHub Pages เป็น public frontend และใช้ API/ฐานข้อมูลบน Fedora
    </p>

    <div class="status" id="backend-status" data-state="idle" role="status" aria-live="polite">
      <strong id="backend-title">กำลังตรวจสอบการเชื่อมต่อ</strong>
      <span id="backend-detail">กำลังอ่าน runtime configuration...</span>
    </div>

    <footer>
      s2health-pa · Fedora-backed frontend
    </footer>
  </main>

  <script>
    (() => {
      const status = document.getElementById('backend-status');
      const title = document.getElementById('backend-title');
      const detail = document.getElementById('backend-detail');
      const config = window.S2HEALTH_CONFIG || {};
      const apiBaseUrl = typeof config.apiBaseUrl === 'string'
        ? config.apiBaseUrl.replace(/\/+$/, '')
        : '';
      const readinessPath = config.readinessPath || '/api/v1/health/ready';

      if (!apiBaseUrl) {
        status.dataset.state = 'idle';
        title.textContent = 'GitHub Pages พร้อมใช้งาน';
        detail.textContent = 'ยังไม่ได้กำหนด public API endpoint ของ Fedora';
        return;
      }

      status.dataset.state = 'checking';
      title.textContent = 'กำลังตรวจสอบ Fedora API';
      detail.textContent = 'ตรวจสอบ readiness ผ่าน public HTTPS endpoint';

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);

      fetch(apiBaseUrl + readinessPath, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        signal: controller.signal,
        headers: { 'Accept': 'application/json' }
      })
        .then(async (response) => {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }

          const payload = await response.json();
          if (payload?.status !== 'ready') {
            throw new Error('unexpected readiness response');
          }

          status.dataset.state = 'ready';
          title.textContent = 'Fedora API พร้อมใช้งาน';
          detail.textContent = 'เชื่อมต่อ API และฐานข้อมูลสำเร็จ';
        })
        .catch((error) => {
          status.dataset.state = 'error';
          title.textContent = 'ยังเชื่อมต่อ Fedora API ไม่สำเร็จ';
          detail.textContent = error?.name === 'AbortError'
            ? 'การตรวจสอบ API หมดเวลา'
            : 'ตรวจสอบ public endpoint หรือ CORS configuration';
        })
        .finally(() => clearTimeout(timeout));
    })();
  </script>
</body>
</html>
